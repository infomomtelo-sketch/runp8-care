# Deploy the stripe-webhook Worker from a browser.
#
# This exists because deploying needed a machine with wrangler on it, and the
# person who owns this Worker does not have one. Run it from GitHub:
# Actions -> "Deploy stripe-webhook Worker" -> Run workflow.
#
# One-time setup: add a repository secret CLOUDFLARE_API_TOKEN
# (Settings -> Secrets and variables -> Actions -> New repository secret).
# Create the token at https://dash.cloudflare.com/profile/api-tokens with the
# "Edit Cloudflare Workers" template, scoped to this account. The token is
# never printed here — wrangler-action reads it from the secret.
#
# What this does NOT touch: the Worker's own secrets (STRIPE_WEBHOOK_SECRET,
# STRIPE_SECRET_KEY, SUPABASE_URL, SUPABASE_SERVICE_KEY). Those are already set
# on the Worker and a deploy leaves them alone — see wrangler.toml. Never add
# them to this file.
#
# THE SECRET NAMES THIS FILE READS, in full, verified against the steps below
# on 2026-09-09. Written out because a secret added under a name nothing reads
# is invisible: the job does not warn, it just behaves as though the secret is
# missing, and the person who added it has no way to tell the two apart.
#
#   secrets.CLOUDFLARE_API_TOKEN   — the ONLY repository secret read here.
#                                    Read three times: the emptiness check, the
#                                    dry-run step, and the deploy step.
#
# There is NO second secret. In particular there is no CLOUDFLARE_ACCOUNT_ID
# secret and nothing here would read one: the account is the plain-text
# CF_ACCOUNT_ID env var below, for the reason written beside it. A repository
# secret by that name is harmless and also useless — it can be deleted.
#
# A name that is close but not exact — CF_API_TOKEN, CLOUDFLARE_TOKEN,
# CLOUDFLARE_API_KEY — is the same as no secret at all, and shows up as the
# "CLOUDFLARE_API_TOKEN is not set" error below rather than as anything about
# the name that was used.
name: Deploy stripe-webhook Worker

on:
  # Manual only, on purpose. This Worker is what turns a Stripe payment into a
  # paid account, so a deploy is a decision someone makes, not something that
  # rides along with an unrelated merge. To deploy automatically on merge
  # instead, uncomment the push trigger below.
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['workers/stripe-webhook/**']

env:
  # Not a credential, and not a secret in any useful sense: an account ID does
  # nothing without a token, and the Cloudflare Pages bot already posts this
  # one in plain sight on every PR in this public repo.
  #
  # It is here because without it wrangler does not know which account to
  # deploy to, and asks Cloudflare by calling GET /memberships — a USER-scoped
  # endpoint that an account-scoped token is refused on, with
  # "Authentication error [code: 10000]". That refusal failed three deploys.
  # Given the account up front, wrangler never makes the call, and the token
  # needs nothing beyond Workers Scripts: Edit.
  CF_ACCOUNT_ID: 701117dde6af00d42bac3c4058b660be
  # Pinned because wrangler-action defaults to 3.90.0 while this Worker's
  # bundle was validated against 4.x. Deploying a billing webhook with a
  # different major version than the one it was checked with is not a detail.
  WRANGLER_VERSION: '4.130.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read through env, not interpolated into the script: a secret spliced
      # straight into a shell line ends up in the command itself. Only its
      # emptiness is ever tested.
      - name: Check the token is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions, then run this again."
            exit 1
          fi

      # Catches a syntax error or a bad wrangler.toml before anything reaches
      # the live Worker. Cheap, and the failure mode it prevents is a billing
      # webhook that 500s on every Stripe delivery.
      - name: Build check (no deploy)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: workers/stripe-webhook
          command: deploy --dry-run

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: workers/stripe-webhook
          command: deploy

      - name: Report the deployed version
        run: |
          echo "### stripe-webhook deployed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.command-output }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Confirm in Stripe: send a test \`customer.subscription.created\` to the \`memorable-wonder\` destination and check the delivery is 200." >> "$GITHUB_STEP_SUMMARY"
