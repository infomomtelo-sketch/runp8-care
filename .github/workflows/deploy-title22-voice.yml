# Deploy the title22-voice Worker (Tello's voice) from a browser.
# Actions -> "Deploy title22-voice Worker" -> Run workflow.
#
# Manual only. Same token and account as deploy-stripe-webhook.yml, which
# explains both at length: the ONLY repository secret read here is
# CLOUDFLARE_API_TOKEN, and the account id is a plain env var on purpose.
#
# The Worker's own secret, DEEPINFRA_API_KEY, is set on the Worker (dashboard:
# Workers & Pages -> title22-voice -> Settings -> Variables and Secrets ->
# Add -> type Secret). A deploy leaves secrets alone. Never add it here.
# Its plain-text vars (VOICE_MODEL, VOICE_ID) live in wrangler.toml, because a
# deploy REPLACES vars with that file's [vars] block.
name: Deploy title22-voice Worker

on:
  workflow_dispatch:

env:
  CF_ACCOUNT_ID: 701117dde6af00d42bac3c4058b660be
  WRANGLER_VERSION: '4.130.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the token is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions, then run this again."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The MP3 encoder is an npm dependency; wrangler bundles it. `npm ci`
      # installs exactly what package-lock.json pinned.
      - name: Install and test
        working-directory: workers/title22-voice
        run: |
          npm ci
          mkdir -p out
          node test.mjs

      - name: Build check (no deploy)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: workers/title22-voice
          command: deploy --dry-run

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: workers/title22-voice
          command: deploy

      - name: Report
        run: |
          echo "### title22-voice deployed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.command-output }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Check: /health must say ok once DEEPINFRA_API_KEY is set; then open /api/tello/voice-preview." >> "$GITHUB_STEP_SUMMARY"
