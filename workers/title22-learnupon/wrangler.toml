name = "title22-learnupon"
main = "index.js"
compatibility_date = "2026-10-05"
# node:crypto, for MD5 (LearnUpon v1 signatures) and HMAC-SHA256 (v2).
compatibility_flags = ["nodejs_compat"]

# New Worker, first deployed from this repo — nothing was ever typed into the
# dashboard for it, so this file is the whole authority. SUPABASE_URL is a
# plain-text var in [vars] at the bottom, the stripe-webhook lesson
# (2026-09-09): a var that lives only in the dashboard is erased by the next
# `wrangler deploy`.
#
# Secrets (set via `wrangler secret put <NAME>` — never stored here):
#   LEARNUPON_WEBHOOK_SECRET — the webhook secret key from the LearnUpon
#                              portal (Settings -> Integrations). Generated in the
#                              partner's SANDBOX portal and revoked after
#                              testing. Never email it.
#   SUPABASE_SERVICE_KEY     — service_role key, to write learnupon_events and
#                              to ask Supabase whose sign-in token a request carries.
#   LEARNUPON_SQSSO_SECRET   — the SQSSO secret key from the same portal page
#                              (Integrations -> SQSSO -> General settings).
#   LEARNUPON_PORTAL_URL     — the partner portal's address, e.g.
#                              https://<portal>.learnupon.com. A secret only so
#                              the partner is not named in this public repo.
#   LEARNUPON_API_USERNAME,
#   LEARNUPON_API_PASSWORD   — the portal's API key pair (Settings -> Integrations
#                              -> API). Used only to enroll a staff learner in
#                              their courses before sign-on. Generating new keys in
#                              the portal replaces the old pair.
#   TRAINING_PARTNER_NAME    — optional: the partner's name as staff should
#                              read it on the welcome page (title22.app/train/...).
#                              A secret so the partner is not named here. Left
#                              unset, the page says "our training partner".
# Sign-on (POST /api/learnupon/sso) answers 503 until the last two are set; the
# webhook does not need them.
#
# Public address for the partner's portal (workers.dev, no custom route):
#   https://title22-learnupon.infomomtelo.workers.dev/api/learnupon/webhook
#
# Needs migrations/2026-10-05_learnupon_events.sql run first.

# Keep this table last.
# STAFF_LINKS_OPEN: "false" = only the app owner can make staff training links
# (test phase). "true" = every home's owner and administrators can. Turn on
# only once the training partner agrees, together with the app's
# T22_STAFF_TRAINING_LINKS_OPEN, then run the deploy workflow.
[vars]
SUPABASE_URL = "https://nwlhsshvqmbhemhxcran.supabase.co"
STAFF_LINKS_OPEN = "false"
# Courses every staff learner is enrolled in before signing on, by the
# portal's course numbers (comma-separated). Practice-site numbers, given by
# the training partner on 2026-10-07; the real site's numbers differ.
LEARNUPON_STAFF_COURSE_IDS = "3768123,3768117,3768111,3768109"
# Optionally also a portal group whose courses they get (its number). Empty =
# no group step.
LEARNUPON_STAFF_GROUP_ID = ""
