# The deployed script is named `mission-control`, not `title22-extract`:
# Cloudflare auto-generated that name when the Worker was created from the
# dashboard, and Workers cannot be renamed. This `name` MUST match the live
# script — `wrangler deploy` targets whatever is named here, so changing it
# creates a second, empty Worker instead of updating the real one.
#
# To move to the intended name: create a new Worker called `title22-extract`,
# deploy this source to it, set the three secrets again, update this `name`
# plus EXTRACT_WORKER in index.html, then delete `mission-control`.
name = "mission-control"
main = "index.js"
compatibility_date = "2026-08-05"

# This Worker was only ever deployed by pasting into the dashboard, so any
# plain-text var on it (EXTRACT_MODEL, say) was typed there. A `wrangler
# deploy` REPLACES vars with this file's [vars] block, which is how the
# stripe-webhook lost SUPABASE_URL on 2026-09-09. keep_vars leaves the
# dashboard's vars alone. Secrets survive a deploy either way.
keep_vars = true

# Secrets (set via `wrangler secret put <NAME>` — never stored here):
#   SUPABASE_URL           — e.g. https://nwlhsshvqmbhemhxcran.supabase.co
#   SUPABASE_SERVICE_KEY   — Supabase service_role key (bypasses RLS; used
#                             server-side only to verify the caller's JWT,
#                             read title22_* profile columns, and deduct from
#                             the shared ai_usage bucket)
#   ANTHROPIC_API_KEY      — Anthropic API key for the Messages API call
#
# Optional override (set with `wrangler secret put` or as a [vars] entry):
#   EXTRACT_MODEL          — defaults to claude-opus-5. Extraction accuracy on
#                            handwriting is the whole point of this worker, so
#                            only step down after measuring on real scans.
#
# ALLOW_RESIDENT_SCAN is no longer read (2026-09-29). Resident, medication and
# TB scans are refused in the code with no switch; see STAFF_DOCS in index.js.
#
# Public route (configured in the Cloudflare dashboard, not here):
#   https://mission-control.infomomtelo.workers.dev/api/extract
