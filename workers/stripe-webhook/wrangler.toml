name = "stripe-webhook"
main = "index.js"
compatibility_date = "2026-09-07"

# This IS the source of what is deployed, as of 2026-09-07. Redeploy with
# `wrangler deploy` from this directory after any change — the Worker was
# dashboard-only before that date, and pasting into the dashboard again is how
# the source and the deploy drift apart.
#
# Secrets (set via `wrangler secret put <NAME>` — never stored here):
#   STRIPE_WEBHOOK_SECRET  — whsec_... for the `memorable-wonder` destination.
#                            Each endpoint has its own; a signature check
#                            against the wrong one fails every request.
#   STRIPE_SECRET_KEY      — sk_live_..., used only to read a customer's email
#                            when a subscription event does not carry one.
#   SUPABASE_SERVICE_KEY   — service_role key. Bypasses RLS, which is what lets
#                            this write profiles and subscriptions for a user
#                            who is not the caller.
#   EMAIL_SERVICE_SECRET   — phase 2 (Nov 20, 2026): shared secret this Worker
#                            sends as X-Title22-Service-Secret when it calls
#                            title22-email's /notify-payment route. The SAME
#                            value must be set as a secret on BOTH Workers.
#                            Deliberately NOT a required binding in index.js:
#                            without it, payment emails degrade to warnings
#                            in the delivery log — subscription events never
#                            fail over an email.
#
# SUPABASE_URL was in that list until 2026-09-13, and it did not belong there.
# It is not a secret — it is the project's public REST host, the same string
# index.html ships to every browser — and in Cloudflare it was never stored as
# one. It was a PLAIN-TEXT VAR, set by hand in the dashboard, and the
# distinction is the whole of the outage below.
#
# `wrangler deploy` preserves secrets. It does NOT preserve plain-text vars: it
# sends the complete set of vars from THIS FILE and replaces whatever the
# Worker had. With no [vars] block here, "the complete set" was none, so the
# first deploy from CI deleted SUPABASE_URL.
#
# That is what happened. The Worker ran from the dashboard until 2026-09-07 and
# worked. Runs #8 and #9 of deploy-stripe-webhook.yml on 2026-09-09 were the
# first `wrangler deploy`s it had ever had, and they took the var with them.
# Nothing looked wrong: the deploy went green, the endpoint stayed Active, the
# signature check kept passing (its secret survived), and every event the
# Worker does not handle kept answering 200. Only the two events that write to
# Supabase broke, and they broke as an opaque 500, because `fetch(undefined +
# '/rest/v1/...')` throws a TypeError into the handler's catch.
#
# It surfaced on 2026-09-13, the first time a real customer bought Lite: both
# checkout.session.completed and customer.subscription.created returned 500,
# the card was charged, and the account read "Free Trial".
#
# So it lives in [vars] now, where a deploy re-sets it every time and the file
# is the authority. Do not move it back to a secret and do not set it in the
# dashboard — a dashboard value is exactly what the next deploy erases. The
# [vars] table itself is at the BOTTOM of this file, so that a key added later
# cannot land inside it by accident.
#
# Stripe dashboard, on the `memorable-wonder` destination, these events:
#   checkout.session.completed
#   customer.subscription.created
#   customer.subscription.updated
#   customer.subscription.deleted
#
# BUNDLE BUILD (2026-11-19): index.js now also handles invoice events to
# write the CTC split ledger. ADD these to the destination in the Stripe
# dashboard before (or with) the deploy, or the ledger silently never runs:
#   invoice.payment_succeeded
#   invoice.paid
#
# PHASE 2 (2026-11-20): index.js also handles invoice.payment_failed to
# send the payment-failed customer email. ADD it to the destination too:
#   invoice.payment_failed
# (Whether the two bundle-build invoice events were ever actually added is
# worth re-checking on the same dashboard visit — the ledger has the same
# silent-never-runs failure mode if they were not.)
#
# REFUND RULE (2026-11-23): index.js also handles charge.refunded — a
# FULL refund cancels only the training and swaps a package subscription
# to the $9 records-only price (see RECORDS_ONLY_PRICE_ID in [vars]
# below). ADD it to the destination too:
#   charge.refunded
# Until it is added there, refunds change nothing in Title22 — the same
# silent-never-runs failure mode as every event above.
#
# PRICE_PLANS in index.js carries both live prices:
#   price_1UClAiAH9qPFLg89ln6eHAVa  $29 Lite        prod_VDBXSXDdmtFrmh
#   price_1UDWroAH9qPFLg89kAs9h49C  $79 Multi-Home  prod_VDypF9WL2wmjGO
# plus the four legacy IDs. Any price not in that map is refused with 422 and
# shows in the delivery log — the loud version of the bug that let a paid
# customer sit on "Free Trial" for a day.
#
# The map is written in each tier's human name, so Multi-Home reads
# plan: 'multi-home'. normalisePlan() folds that to 'multi' before anything is
# written, because index.html's TIER_LIMITS and T22_PAID are keyed on 'multi' —
# storing the unfolded string would read as unpaid AND drop the subscriber to
# one facility with no Tello.

# SERVICE BINDING (2026-11-22): how stripe-webhook reaches title22-email.
# A Worker fetching another Worker's workers.dev URL gets a bare platform
# 404 — no body, and the callee's code never runs — so the EMAIL_WORKER_URL
# fetch failed every payment email while the email Worker itself was
# healthy (proven live 2026-11-22: the route answered 401 to an outside
# caller with a wrong secret, and /health read ok). The binding is
# Cloudflare's supported Worker-to-Worker channel. It is declared HERE,
# on the caller; title22-email needs no matching change. Redeploy
# stripe-webhook after adding this or the binding does not exist at
# runtime — and keep this block ABOVE [vars], or it would be read as a
# var instead of a binding.
[[services]]
binding = "EMAIL_WORKER"
service = "title22-email"

# Keep this table last. Everything above it is a comment or a top-level key;
# anything written below it belongs to [vars] whether that was meant or not.
[vars]
SUPABASE_URL = "https://nwlhsshvqmbhemhxcran.supabase.co"
# Phase 2 (Nov 20, 2026): the customer payment emails' destination.
# A public workers.dev address, not a secret — same reasoning as
# SUPABASE_URL above, and in [vars] for the same reason: the file is the
# authority, so a deploy re-sets it instead of erasing it.
# Since 2026-11-22 this is the FALLBACK path only, plus documentation of
# the callee's public address: the live path is the EMAIL_WORKER service
# binding above, because a Worker-to-Worker fetch to this URL is answered
# by the platform with a 404 before the callee ever runs.
EMAIL_WORKER_URL = "https://title22-email.infomomtelo.workers.dev"
# REFUND RULE (2026-11-23): the Stripe price ID of the $9/month
# records-only price a refunded package subscription is swapped to, so
# the subscription continues at $9 with the training cancelled. The
# price does not exist yet — Eli creates it in Stripe (Products → a
# $9/month recurring price) and its ID goes here, in this file, before
# the refund build is deployed; a dashboard-set value would be erased
# by the next deploy, per the SUPABASE_URL lesson above. While this is
# empty, a package refund still cancels the training and still sends
# both emails, but the swap fails LOUDLY: the delivery body carries a
# REFUND PRICE SWAP FAILED warning, the owner alert names it, and the
# buyer email does not promise the $9 renewal.
RECORDS_ONLY_PRICE_ID = "price_1Uf1jBAH9qPFLg894lhjOCBw"
