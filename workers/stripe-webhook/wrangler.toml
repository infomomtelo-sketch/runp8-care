name = "stripe-webhook"
main = "index.js"
compatibility_date = "2026-09-07"

# This IS the source of what is deployed, as of 2026-09-07. Redeploy with
# `wrangler deploy` from this directory after any change — the Worker was
# dashboard-only before that date, and pasting into the dashboard again is how
# the source and the deploy drift apart.
#
# Secrets (set via `wrangler secret put <NAME>` — never stored here):
#   STRIPE_WEBHOOK_SECRET  — whsec_... for the `memorable-wonder` destination.
#                            Each endpoint has its own; a signature check
#                            against the wrong one fails every request.
#   STRIPE_SECRET_KEY      — sk_live_..., used only to read a customer's email
#                            when a subscription event does not carry one.
#   SUPABASE_URL           — https://nwlhsshvqmbhemhxcran.supabase.co
#   SUPABASE_SERVICE_KEY   — service_role key. Bypasses RLS, which is what lets
#                            this write profiles and subscriptions for a user
#                            who is not the caller.
#
# Stripe dashboard, on the `memorable-wonder` destination, these events:
#   checkout.session.completed
#   customer.subscription.created
#   customer.subscription.updated
#   customer.subscription.deleted
#
# PRICE_PLANS in index.js carries both live prices:
#   price_1UCIAiAH9qPFLg89ln6eHAVa  $29 Lite        prod_VDBXSXDdmtFrmh
#   price_1UDWroAH9qPFLg89kAs9h49C  $79 Multi-Home  prod_VDypF9WL2wmjGO
# plus the four legacy IDs. Any price not in that map is refused with 422 and
# shows in the delivery log — the loud version of the bug that let a paid
# customer sit on "Free Trial" for a day.
#
# The map is written in each tier's human name, so Multi-Home reads
# plan: 'multi-home'. normalisePlan() folds that to 'multi' before anything is
# written, because index.html's TIER_LIMITS and T22_PAID are keyed on 'multi' —
# storing the unfolded string would read as unpaid AND drop the subscriber to
# one facility with no Tello.
