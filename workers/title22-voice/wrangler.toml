name = "title22-voice"
main = "index.js"
compatibility_date = "2026-09-27"

# Both were set in the dashboard, and the first CI deploy (2026-09-27, version
# 8a5b4e68) overwrote them: wrangler applies this file's settings, and a
# setting that is absent here falls back to wrangler's default, not to the
# dashboard's. So they live here now.
#   preview_urls = false  — no per-version preview hostnames. This Worker holds
#                           a paid API key; one public route is enough.
#   observability         — keep Workers Logs on, so a failed DeepInfra call
#                           (console.error in index.js) is kept for later.
preview_urls = false

[observability]
enabled = true

# Tello's voice. B1 step 0: a PREVIEW route only, so the match test against
# tello-voice-reference.wav runs on Cloudflare with the real key. The signed-in
# briefing route (/api/tello/briefing-voice), R2 cache and rate limit come after
# the voice is approved; nothing in index.html calls this Worker yet.
#
# Public route (workers.dev, enabled on first deploy):
#   https://title22-voice.infomomtelo.workers.dev/api/tello/voice-preview
#
# Secrets (set via `wrangler secret put <NAME>` or the dashboard — never here):
#   DEEPINFRA_API_KEY  — DeepInfra API key. Read by one function, sent only as
#                        the Authorization header to api.deepinfra.com, never
#                        logged and never echoed in a response.
#
# Plain-text vars. Everything this Worker needs that is not a secret is HERE,
# because `wrangler deploy` replaces the Worker's vars with exactly this block —
# a value typed into the dashboard is deleted by the next deploy. That is the
# 2026-09-13 stripe-webhook outage; see CLAUDE.md.
[vars]
VOICE_MODEL = "hexgrad/Kokoro-82M"
VOICE_ID = "af_heart"
