<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Talk to Charrise · Title22</title>
<meta name="description" content="Talk to Charrise, the AI assistant for Title22. Ask anything about Title22 in your own words and language, by typing or talking, and send Title22 a note when you want a reply."/>
<meta name="theme-color" content="#ffffff"/>
<link rel="icon" href="/tello-favicon.svg"/>
<link rel="apple-touch-icon" href="/tello-apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet"/>
<!--
  "Talk to my assistant" (2026-09-29). A visitor talks to Charrise instead of
  booking a meeting. It speaks as Title22 and never names the person behind
  it (the owner's wish, 2026-09-29). No sign-in: the chat lives in this tab only
  (sessionStorage) and the server keeps nothing but what the visitor sends
  with "Send to Title22". Listening uses the browser's own speech recognition, and
  her voice is the phone's own (speechSynthesis), so it speaks any language
  the phone has a voice for and costs nothing per reply.
  Server side: workers/title22-ai/assistant.js. Leads: Tello's Cabinet.
-->
<style>
:root{--bg:#ffffff;--soft:#f6f8f7;--line:#e7ecea;--ink:#1c2723;--muted:#6b7a74;--green:#1d5c4d;--green-soft:#e9f2ef;--gold:#e8a23d;--bad:#9b3b3b;--bad-bg:#fbf1f1;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Public Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:15.5px;-webkit-text-size-adjust:100%;display:flex;flex-direction:column}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.bar{background:var(--bg);border-bottom:1px solid var(--line);flex:none}
.bar-in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:11px}
.mark{flex:none;width:36px;height:36px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-family:'Zilla Slab',Georgia,serif;font-weight:700;font-size:18px;position:relative}
.bar .mark::after{content:"";position:absolute;right:0;bottom:1px;width:9px;height:9px;border-radius:50%;background:#3aa76d;border:2px solid var(--bg)}
.who{display:flex;flex-direction:column;min-width:0;flex:1}
.who b{font-size:16px;font-weight:600;line-height:1.2}
.who small{font-size:12.5px;color:var(--muted)}
#lang{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;max-width:118px}
.wrap{flex:1;display:flex;flex-direction:column;width:100%;max-width:720px;margin:0 auto;padding:0 16px;min-height:0}
#scroll{flex:1;overflow-y:auto;padding:20px 0 8px;-webkit-overflow-scrolling:touch}
#thread{display:flex;flex-direction:column;gap:10px}
.turn{max-width:82%;padding:10px 14px;border-radius:var(--r);font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.turn.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:6px}
.turn.her{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.turn.err{background:var(--bad-bg);color:var(--bad)}
.turn.thinking{color:var(--muted)}
.play{display:block;margin:4px 0 0;font-size:12px;padding:0;border:none;background:none;color:var(--green);font-weight:600}
.play.on{color:var(--gold)}
.send-eli{align-self:flex-start;margin:4px 0 2px;border:1px solid var(--line);border-radius:20px;padding:7px 14px;background:var(--bg);color:var(--green);font-weight:600;font-size:13.5px}
.send-eli:hover{border-color:var(--green)}
.voice-bar{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 12px;border-radius:14px;background:var(--green-soft);color:var(--green);font-size:13.5px}
.voice-bar .mark{width:24px;height:24px;font-size:13px;background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(29,92,77,0)}0%{box-shadow:0 0 0 0 rgba(29,92,77,.25)}}
.voice-bar span{flex:1}
.voice-bar button{border:none;border-radius:14px;padding:5px 12px;background:var(--green);color:#fff;font-weight:600;font-size:12.5px}
.composer{flex:none;display:flex;align-items:flex-end;gap:6px;margin:8px 0 calc(8px + env(safe-area-inset-bottom));padding:6px;border:1px solid var(--line);border-radius:24px;background:var(--bg);box-shadow:0 2px 10px rgba(20,40,34,.06)}
.composer:focus-within{border-color:#b9cfc8}
#say{flex:1;min-width:0;padding:8px 10px;border:none;background:transparent;outline:none;resize:none;line-height:1.5;max-height:140px}
#say::placeholder{color:#9aa7a2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{flex:none;width:38px;height:38px;border-radius:50%;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--soft);color:var(--green)}
.icon-btn.on{background:var(--green-soft);color:var(--green)}
#send{flex:none;width:38px;height:38px;border-radius:50%;border:none;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
#send[disabled]{opacity:.45}
.foot{flex:none;font-size:11.5px;color:var(--muted);text-align:center;padding:0 16px calc(10px + env(safe-area-inset-bottom));line-height:1.6}
.foot button{border:none;background:none;color:var(--muted);text-decoration:underline;font-size:11.5px;padding:0}
.sheet{display:none;position:fixed;inset:0;background:rgba(20,30,27,.35);z-index:20;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet-in{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet-top b{font-size:18px;font-weight:600}
.sheet-top button{border:none;background:none;color:var(--muted);font-size:14px}
.sheet p{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.sheet label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin:10px 0 4px}
.sheet input,.sheet textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:none}
.sheet input:focus,.sheet textarea:focus{border-color:#b9cfc8}
.sheet textarea{min-height:76px;resize:vertical}
.btn{width:100%;margin-top:16px;padding:12px;border:none;border-radius:12px;background:var(--green);color:#fff;font-weight:600}
.btn[disabled]{opacity:.55}
.msg{font-size:13px;margin-top:10px;color:var(--green)}
.msg.bad{color:var(--bad)}
@media(prefers-reduced-motion:reduce){.voice-bar .mark{animation:none}}
</style>
</head>
<body>

<div class="bar"><div class="bar-in">
  <span class="mark" aria-hidden="true">C</span>
  <div class="who"><b>Charrise</b><small>AI assistant · Title22</small></div>
  <select id="lang" aria-label="Language for talking" onchange="setLang(this.value)"></select>
</div></div>

<div class="wrap">
  <div id="scroll"><div id="thread"></div></div>
  <div class="voice-bar" id="vbar" hidden><span class="mark" aria-hidden="true">C</span><span id="vtext">Listening</span><button type="button" onclick="talkEnd()">End</button></div>
  <div class="composer">
    <textarea id="say" rows="1" placeholder="Message Charrise" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();ask()}" oninput="grow(this)" aria-label="Your message"></textarea>
    <button class="icon-btn" id="mic" type="button" onclick="talkToggle()" title="Talk" aria-label="Talk to Charrise"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="send" type="button" onclick="ask()" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
</div>
<div class="foot">AI, can be wrong · No health information, please · Powered by Tello · <button type="button" onclick="openLead('wants-own')">Get your own assistant</button></div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeLead()">
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="lead-title">
    <div class="sheet-top"><b id="lead-title">Send to Title22</b><button type="button" onclick="closeLead()">Close</button></div>
    <p id="lead-intro">Every message is read, and answered by text or email. A short summary of your chat with Charrise goes with it.</p>
    <label for="l-name">Your name</label><input id="l-name" autocomplete="name"/>
    <label for="l-contact">Email or phone</label><input id="l-contact" autocomplete="email" inputmode="email"/>
    <label for="l-biz">Your business (optional)</label><input id="l-biz" autocomplete="organization"/>
    <label for="l-msg">What would you like from Title22? (optional)</label><textarea id="l-msg"></textarea>
    <button class="btn" id="l-send" type="button" onclick="sendLead()">Send</button>
    <div class="msg" id="l-out"></div>
  </div>
</div>

<script>
const API='https://title22-ai.infomomtelo.workers.dev/api/assistant';
const ASSISTANT='title22';
const $=id=>document.getElementById(id);
// Languages for listening and speaking. She WRITES in any language whatever
// is picked here; this only tells the phone which language to hear and which
// voice to use.
const LANGS=[['en-US','English'],['es-US','Español'],['fil-PH','Tagalog'],['pa-IN','ਪੰਜਾਬੀ'],['zh-CN','中文'],['vi-VN','Tiếng Việt'],['ko-KR','한국어'],['hi-IN','हिन्दी']];
let lang='en-US',kind='follow-up',busy=false;
let chat=[];
try{chat=JSON.parse(sessionStorage.getItem('charrise_chat')||'[]')}catch(e){chat=[]}
function saveChat(){try{sessionStorage.setItem('charrise_chat',JSON.stringify(chat.slice(-40)))}catch(e){}}
LANGS.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;$('lang').appendChild(o)});
(function(){let saved=null;try{saved=localStorage.getItem('charrise_lang')}catch(e){}
  const nav=(navigator.language||'en-US');const m=LANGS.find(l=>l[0]===saved)||LANGS.find(l=>l[0].slice(0,2)===nav.slice(0,2))||LANGS[0];lang=m[0];$('lang').value=lang})();
function setLang(v){lang=v;try{localStorage.setItem('charrise_lang',v)}catch(e){}}

const GREETING="Hi, I'm Charrise, Title22's AI assistant. Ask me anything, in any language. Type or tap the mic.";
function turn(text,cls,withPlay){
  const d=document.createElement('div');d.className='turn '+cls;d.textContent=text;
  if(withPlay&&canSpeak()){const b=document.createElement('button');b.type='button';b.className='play';b.textContent='Play';b.onclick=()=>playOne(text,b);d.appendChild(b)}
  $('thread').appendChild(d);scrollEnd();return d;
}
function scrollEnd(){const s=$('scroll');s.scrollTop=s.scrollHeight}
function grow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,140)+'px'}
function render(){
  $('thread').innerHTML='';turn(GREETING,'her',true);
  chat.forEach(m=>turn(m.content,m.role==='user'?'me':'her',m.role==='assistant'));
  const b=document.createElement('button');b.type='button';b.className='send-eli';b.id='send-eli';b.textContent='Send to Title22';b.onclick=()=>openLead('follow-up');
  $('thread').appendChild(b);scrollEnd();
}
function moveSendEli(){const b=$('send-eli');if(b)$('thread').appendChild(b);scrollEnd()}

// Contact details belong in the form, not the chat: the form is what reaches
// Title22, and the chat is sent to the model.
const CHAT_BLOCK=[
  [/\b[\w.+-]+@[\w-]+\.[A-Za-z]{2,}\b/,'an email address'],
  [/\b\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}\b/,'a phone number'],
  [/\b\d{3}-\d{2}-\d{4}\b/,'a Social Security number'],
  [/\b(d\.?o\.?b\.?|date of birth|mrn|medical record)\b/i,'health or identity details'],
];
async function ask(text){
  if(busy)return null;
  const q=(text||$('say').value).trim();if(!q)return null;
  const hit=CHAT_BLOCK.find(([re])=>re.test(q));
  if(hit){turn('That looks like '+hit[1]+'. Please leave it out of the chat. To get a reply, tap Send to Title22 and put your contact details there.','her err');moveSendEli();return null}
  $('say').value='';grow($('say'));
  chat.push({role:'user',content:q});saveChat();turn(q,'me');
  const th=turn('Charrise is typing…','her thinking');busy=true;$('send').disabled=true;
  let reply=null;
  try{
    const r=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assistant:ASSISTANT,messages:chat,lang})});
    const d=await r.json().catch(()=>({}));th.remove();
    if(!r.ok||!d.reply){turn(d.message||'Sorry, I could not answer just now. Please try again.','her err');chat.pop();saveChat()}
    else{reply=d.reply;chat.push({role:'assistant',content:reply});saveChat();turn(reply,'her',true)}
  }catch(e){th.remove();turn('I cannot reach my desk right now. Check your connection and try again.','her err');chat.pop();saveChat()}
  busy=false;$('send').disabled=false;moveSendEli();
  return reply;
}

/* ---- her voice: the phone's own, in the chosen language ---- */
const SS=window.speechSynthesis||null;
function canSpeak(){return !!SS}
function voiceFor(l){if(!SS)return null;const vs=SS.getVoices();return vs.find(v=>v.lang===l)||vs.find(v=>v.lang&&v.lang.slice(0,2)===l.slice(0,2))||null}
let playing=null;
function speak(text,onend){
  if(!SS){onend&&onend();return false}
  SS.cancel();const u=new SpeechSynthesisUtterance(text);const v=voiceFor(lang);if(v)u.voice=v;u.lang=v?v.lang:lang;u.rate=1;
  u.onend=()=>{onend&&onend()};u.onerror=()=>{onend&&onend()};SS.speak(u);return true;
}
function playOne(text,btn){
  if(playing===btn){SS.cancel();btn.textContent='Play';btn.classList.remove('on');playing=null;return}
  if(playing){playing.textContent='Play';playing.classList.remove('on')}
  playing=btn;btn.textContent='Stop';btn.classList.add('on');
  speak(text,()=>{btn.textContent='Play';btn.classList.remove('on');if(playing===btn)playing=null});
}

/* ---- talking: listen, answer, say it, listen again ---- */
const Rec=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let talkOn=false,rec=null,misses=0;
function bar(t){$('vbar').hidden=false;$('vtext').textContent=t}
function talkToggle(){talkOn?talkEnd():talkStart()}
function talkStart(){
  if(!Rec){turn('This browser cannot listen. On an iPhone, open this page in Safari, or use the microphone on your keyboard.','her err');return}
  if(SS){try{SS.speak(new SpeechSynthesisUtterance(''))}catch(e){}}   // this tap lets her speak later on an iPhone
  talkOn=true;misses=0;$('mic').classList.add('on');listen();
}
function talkEnd(){talkOn=false;$('mic').classList.remove('on');if(rec){try{rec.abort()}catch(e){}rec=null}if(SS)SS.cancel();$('vbar').hidden=true}
function listen(){
  if(!talkOn)return;bar('Listening… just talk');
  const r=new Rec();rec=r;r.lang=lang;r.interimResults=true;r.continuous=false;let heard='';
  r.onresult=e=>{heard=Array.from(e.results).map(x=>x[0].transcript).join(' ').trim();$('say').value=heard;grow($('say'))};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){talkEnd();turn('Charrise needs your microphone. Allow it for this page in your browser settings, then tap the microphone again.','her err')}};
  r.onend=async()=>{
    if(rec!==r||!talkOn)return;rec=null;
    if(!heard){if(++misses>=2){talkEnd();return}listen();return}
    misses=0;bar('Charrise is thinking…');
    const reply=await ask(heard);if(!talkOn)return;
    if(!reply){listen();return}
    bar('Charrise is talking');
    if(!speak(reply,()=>{if(talkOn)listen()}))listen();
  };
  try{r.start()}catch(e){talkEnd()}
}

/* ---- Send to Title22 ---- */
function openLead(k){
  kind=k;talkEnd();
  $('lead-title').textContent=k==='wants-own'?'An assistant for your business':'Send to Title22';
  $('lead-intro').textContent=k==='wants-own'?'Tell us about your business and how to reach you. We will get back to you about an assistant like Charrise.':'Every message is read, and answered by text or email. A short summary of your chat with Charrise goes with it.';
  $('l-out').textContent='';$('l-out').className='msg';$('l-send').disabled=false;$('l-send').textContent='Send';
  $('sheet').classList.add('open');setTimeout(()=>$('l-name').focus(),50);
}
function closeLead(){$('sheet').classList.remove('open')}
async function sendLead(){
  const out=$('l-out');out.className='msg';
  const body={assistant:ASSISTANT,kind,name:$('l-name').value.trim(),contact:$('l-contact').value.trim(),business:$('l-biz').value.trim(),message:$('l-msg').value.trim(),lang,transcript:kind==='follow-up'?chat:[]};
  if(!body.name||!body.contact){out.className='msg bad';out.textContent='Please leave your name and an email or phone number.';return}
  $('l-send').disabled=true;$('l-send').textContent='Sending…';
  try{
    const r=await fetch(API+'/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){out.className='msg bad';out.textContent=d.message||'That did not go through. Please try again.';$('l-send').disabled=false;$('l-send').textContent='Send';return}
    $('l-send').textContent='Sent';out.textContent='Thank you. Title22 has your message and will get back to you.';
    turn('Thank you, '+body.name.split(/\s+/)[0]+'. Title22 has your message and will get back to you.','her');moveSendEli();
    setTimeout(closeLead,1800);
  }catch(e){out.className='msg bad';out.textContent='No connection. Please try again.';$('l-send').disabled=false;$('l-send').textContent='Send'}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLead()});
if(SS&&SS.onvoiceschanged!==undefined)SS.onvoiceschanged=()=>{};
render();
</script>
</body>
</html>
